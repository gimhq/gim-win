name: ci

on:
  push:
    branches: [main]
  pull_request:

# gim-client-sdk is a path dependency at /srv/gimhq/gim-client-sdk
# (src-tauri/Cargo.toml). Both jobs check it out and link it to that path.
# Temporary until the SDK becomes a git dependency.

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gimhq/gim-client-sdk
          path: gim-client-sdk
      - name: Link gim-client-sdk to the path Cargo.toml expects
        run: |
          sudo mkdir -p /srv/gimhq
          sudo ln -s "$GITHUB_WORKSPACE/gim-client-sdk" /srv/gimhq/gim-client-sdk
      - name: Install Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev build-essential curl wget file xdg-utils \
            pkg-config unzip
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
      - run: cargo build
        working-directory: src-tauri

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gimhq/gim-client-sdk
          path: gim-client-sdk
      - name: Link gim-client-sdk to the path Cargo.toml expects
        # cargo resolves /srv/gimhq/... relative to the current drive (C:).
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\srv\gimhq | Out-Null
          New-Item -ItemType Junction -Path C:\srv\gimhq\gim-client-sdk -Target "$env:GITHUB_WORKSPACE\gim-client-sdk" | Out-Null
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun tauri build --debug
